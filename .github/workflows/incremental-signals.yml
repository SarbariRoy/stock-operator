name: Incremental Signals

on:
  workflow_dispatch:
    inputs:
      commit_changes:
        description: "Commit generated files back to master"
        required: true
        default: true
        type: boolean
      refresh_prices:
        description: "Refresh prices before generating signals"
        required: true
        default: false
        type: boolean
      recompute_pattern_weights:
        description: "Recompute pattern-family weights after updating signals"
        required: true
        default: false
        type: boolean
      backfill_history:
        description: "Rebuild full historical signal files instead of latest-date incremental update"
        required: true
        default: false
        type: boolean
      days:
        description: "Price lookback days used when refresh_prices=true"
        required: true
        default: "1200"
        type: string
      send_telegram:
        description: "Send Telegram update after the workflow"
        required: true
        default: false
        type: boolean
      as_of_date:
        description: "Optional signal date in YYYY-MM-DD. Leave blank for latest available date."
        required: false
        default: ""
        type: string

concurrency:
  group: incremental-signals-master
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-incremental-signals:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate incremental signal files
        env:
          AS_OF_DATE: ${{ inputs.as_of_date }}
          REFRESH_PRICES: ${{ inputs.refresh_prices }}
          RECOMPUTE_PATTERN_WEIGHTS: ${{ inputs.recompute_pattern_weights }}
          BACKFILL_HISTORY: ${{ inputs.backfill_history }}
          DAYS: ${{ inputs.days }}
        run: |
          python stock_triggers/scripts/run_signal_refresh_pipeline.py \
            --mode incremental \
            --refresh-prices "${REFRESH_PRICES}" \
            --recompute-pattern-weights "${RECOMPUTE_PATTERN_WEIGHTS}" \
            --backfill-history "${BACKFILL_HISTORY}" \
            --include-stock-scores false \
            --as-of-date "${AS_OF_DATE}" \
            --days "${DAYS}"

          - name: Verify coverage guardrails
          run: |
            python - <<'PY'
            from __future__ import annotations

            import io
            import subprocess
            import sys
            from pathlib import Path

            import pandas as pd

            FILES = [
              "stock_triggers/data/lt_signals_pattern_a.csv",
              "stock_triggers/data/st_signals_all_patterns.csv",
              "stock_triggers/data/lt_stop_risk_walk_forward_oos_complete.csv",
            ]

            def load_current(path_str: str) -> pd.DataFrame | None:
              path = Path(path_str)
              if not path.exists():
                print(f"ERROR: required file missing after pipeline run: {path_str}")
                return None
              return pd.read_csv(path)

            def load_head(path_str: str) -> pd.DataFrame | None:
              try:
                blob = subprocess.check_output(["git", "show", f"HEAD:{path_str}"], text=True)
              except subprocess.CalledProcessError:
                return None
              return pd.read_csv(io.StringIO(blob))

            def normalize(df: pd.DataFrame, path_str: str) -> pd.DataFrame:
              out = df.copy()
              if path_str.endswith("lt_stop_risk_walk_forward_oos_complete.csv") and "candidate_name" in out.columns:
                out = out[out["candidate_name"].astype(str) == "scores_only"].copy()
              out["signal_date"] = pd.to_datetime(out.get("signal_date"), errors="coerce")
              out = out.dropna(subset=["signal_date"]).copy()
              return out

            failures: list[str] = []
            for path_str in FILES:
              current_raw = load_current(path_str)
              if current_raw is None:
                failures.append(f"missing current file: {path_str}")
                continue
              current = normalize(current_raw, path_str)
              if current.empty:
                failures.append(f"empty signal_date coverage after run: {path_str}")
                continue

              current_min = current["signal_date"].min()
              current_max = current["signal_date"].max()
              print(f"CURRENT {path_str}: rows={len(current)} min={current_min.date()} max={current_max.date()}")

              head_raw = load_head(path_str)
              if head_raw is None:
                print(f"BASELINE {path_str}: not present in HEAD, skipping shrinkage comparison")
                continue
              head = normalize(head_raw, path_str)
              if head.empty:
                print(f"BASELINE {path_str}: empty in HEAD, skipping shrinkage comparison")
                continue

              head_min = head["signal_date"].min()
              head_max = head["signal_date"].max()
              print(f"HEAD    {path_str}: rows={len(head)} min={head_min.date()} max={head_max.date()}")

              if current_min > head_min:
                failures.append(
                  f"coverage shrank at start for {path_str}: current min {current_min.date()} > head min {head_min.date()}"
                )
              if current_max < head_max:
                failures.append(
                  f"coverage shrank at end for {path_str}: current max {current_max.date()} < head max {head_max.date()}"
                )

            if failures:
              print("\nCOVERAGE_GUARDRAIL_FAILURES:")
              for failure in failures:
                print(f"- {failure}")
              sys.exit(1)

            print("\nCoverage guardrails passed.")
            PY

      - name: Commit incremental signal files
        if: ${{ inputs.commit_changes }}
        env:
          AS_OF_DATE: ${{ inputs.as_of_date }}
          REFRESH_PRICES: ${{ inputs.refresh_prices }}
          RECOMPUTE_PATTERN_WEIGHTS: ${{ inputs.recompute_pattern_weights }}
          BACKFILL_HISTORY: ${{ inputs.backfill_history }}
          DAYS: ${{ inputs.days }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git add -f -- stock_triggers/data/st_lt_prices_eod.csv stock_triggers/data/lt_signals_pattern_a.csv stock_triggers/data/lt_sell_signals.csv stock_triggers/data/st_signals_all_patterns.csv stock_triggers/data/st_lt_pattern_weights.json stock_triggers/data/st_lt_signal_penalty_weights.json stock_triggers/data/st_lt_signal_stop_risk_model.json stock_triggers/data/st_lt_candle_weights.json stock_triggers/data/lt_stop_risk_walk_forward_oos_complete.csv
          if git diff --cached --quiet; then
            echo "No incremental data changes to commit."
          else
            git commit -m "chore: incremental signal update [skip ci]"
            if ! git push origin HEAD:master; then
              echo "Push failed because origin/master moved. Regenerating from latest master and retrying once..."
              git fetch origin master
              git reset --hard origin/master
              python stock_triggers/scripts/run_signal_refresh_pipeline.py \
                --mode incremental \
                --refresh-prices "${REFRESH_PRICES}" \
                --recompute-pattern-weights "${RECOMPUTE_PATTERN_WEIGHTS}" \
                --backfill-history "${BACKFILL_HISTORY}" \
                --include-stock-scores false \
                --as-of-date "${AS_OF_DATE}" \
                --days "${DAYS}"
              git add -f -- stock_triggers/data/st_lt_prices_eod.csv stock_triggers/data/lt_signals_pattern_a.csv stock_triggers/data/lt_sell_signals.csv stock_triggers/data/st_signals_all_patterns.csv stock_triggers/data/st_lt_pattern_weights.json stock_triggers/data/st_lt_signal_penalty_weights.json stock_triggers/data/st_lt_signal_stop_risk_model.json stock_triggers/data/st_lt_candle_weights.json stock_triggers/data/lt_stop_risk_walk_forward_oos_complete.csv
              if git diff --cached --quiet; then
                echo "No incremental data changes to commit after retry."
              else
                git commit -m "chore: incremental signal update [skip ci]"
                git push origin HEAD:master
              fi
            fi
          fi

      - name: Send Telegram update (optional)
        if: ${{ always() && inputs.send_telegram }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "Telegram secrets not set. Skipping Telegram notification."
            exit 0
          fi
          python stock_triggers/scripts/daily_triggers_telegram.py --send-only