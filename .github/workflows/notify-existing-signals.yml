name: Notify Existing Signals

on:
  workflow_dispatch:  # Manual trigger only
  # schedule:
  #   # Disabled: Daily Triggers now includes Telegram notification
  #   - cron: "0 14 * * 1-5"

jobs:
  notify-only:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Send Telegram from existing signals
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "Telegram secrets not set. Skipping Telegram notification."
            exit 0
          fi
          python stock_triggers/scripts/daily_triggers_telegram.py --send-only
