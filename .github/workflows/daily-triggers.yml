name: Full Refresh Pipeline

on:
  workflow_dispatch:
    inputs:
      backfill_history:
        description: "Rebuild full historical signal files instead of incrementally updating existing history"
        required: true
        default: false
        type: boolean
  schedule:
    # 13:30 UTC ~= 19:00 IST, Mon-Fri
    - cron: "30 13 * * 1-5"

concurrency:
  group: full-refresh-master
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-daily-triggers:
    runs-on: ubuntu-latest
    env:
      BACKFILL_HISTORY: ${{ inputs.backfill_history }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh prices
        run: |
          python stock_triggers/scripts/update_prices_yf.py \
            --user-agent Brilliant \
            --days 1200 \
            --pause-seconds 0.8 \
            --overwrite \
            --universe-file stock_triggers/data/universe_tickers.txt

      - name: Generate all-pattern signals
        run: |
          signal_args=()
          if [[ "${BACKFILL_HISTORY}" == "true" ]] || [[ ! -f stock_triggers/data/signals_all_patterns.csv ]]; then
            signal_args+=(--backfill-history)
          fi
          python stock_triggers/scripts/generate_signals_all_patterns.py "${signal_args[@]}"

      - name: Build shared training artifact
        run: |
          python stock_triggers/scripts/build_training_signals_history.py

      - name: Compute pattern-family weights
        run: |
          python stock_triggers/scripts/compute_pattern_weights.py \
            --training-data stock_triggers/data/training_signals_history.csv

      - name: Re-score all-pattern signals with updated family weights
        run: |
          python stock_triggers/scripts/generate_signals_all_patterns.py --rescore-only

      - name: Refresh shared training artifact after family-weight rescore
        run: |
          python stock_triggers/scripts/build_training_signals_history.py

      - name: Compute row-level signal penalties
        run: |
          python stock_triggers/scripts/compute_signal_penalty_weights.py \
            --training-data stock_triggers/data/training_signals_history.csv

      - name: Re-score all-pattern signals with learned penalties
        run: |
          python stock_triggers/scripts/generate_signals_all_patterns.py --rescore-only

      - name: Refresh shared training artifact after penalty rescore
        run: |
          python stock_triggers/scripts/build_training_signals_history.py

      - name: Compute monotonic stop-risk model
        run: |
          python stock_triggers/scripts/compute_signal_stop_risk_model.py \
            --feature-set scores_only \
            --training-data stock_triggers/data/training_signals_history.csv

      - name: Rebuild final signal files with calibrated reliability scores
        run: |
          pattern_a_args=()
          if [[ "${BACKFILL_HISTORY}" == "true" ]] || [[ ! -f stock_triggers/data/signals_pattern_a.csv ]]; then
            pattern_a_args+=(--backfill-history)
          fi
          python stock_triggers/scripts/generate_triggers_pattern_a.py "${pattern_a_args[@]}"
          python stock_triggers/scripts/generate_signals_all_patterns.py --rescore-only

      - name: Compute candle-shape enhancer weights
        run: |
          python stock_triggers/scripts/compute_candle_weights.py \
            --prices stock_triggers/data/prices_eod.csv \
            --signals stock_triggers/data/signals_all_patterns.csv \
            --out stock_triggers/data/candle_weights.json

      - name: Generate stock health scores
        run: |
          python stock_triggers/scripts/generate_stock_scores.py

      - name: Commit updated data files
        run: |
          set -euo pipefail

          regenerate_outputs() {
            local -a all_pattern_args=()
            local -a pattern_a_args=()
            if [[ "${BACKFILL_HISTORY}" == "true" ]] || [[ ! -f stock_triggers/data/signals_all_patterns.csv ]]; then
              all_pattern_args+=(--backfill-history)
            fi
            if [[ "${BACKFILL_HISTORY}" == "true" ]] || [[ ! -f stock_triggers/data/signals_pattern_a.csv ]]; then
              pattern_a_args+=(--backfill-history)
            fi

            python stock_triggers/scripts/update_prices_yf.py \
              --user-agent Brilliant \
              --days 1200 \
              --pause-seconds 0.8 \
              --overwrite \
              --universe-file stock_triggers/data/universe_tickers.txt

            python stock_triggers/scripts/generate_signals_all_patterns.py "${all_pattern_args[@]}"
            python stock_triggers/scripts/build_training_signals_history.py
            python stock_triggers/scripts/compute_pattern_weights.py \
              --training-data stock_triggers/data/training_signals_history.csv
            python stock_triggers/scripts/generate_signals_all_patterns.py --rescore-only
            python stock_triggers/scripts/build_training_signals_history.py
            python stock_triggers/scripts/compute_signal_penalty_weights.py \
              --training-data stock_triggers/data/training_signals_history.csv
            python stock_triggers/scripts/generate_signals_all_patterns.py --rescore-only
            python stock_triggers/scripts/build_training_signals_history.py
            python stock_triggers/scripts/compute_signal_stop_risk_model.py \
              --feature-set scores_only \
              --training-data stock_triggers/data/training_signals_history.csv
            python stock_triggers/scripts/generate_triggers_pattern_a.py "${pattern_a_args[@]}"
            python stock_triggers/scripts/generate_signals_all_patterns.py --rescore-only
            python stock_triggers/scripts/compute_candle_weights.py \
              --prices stock_triggers/data/prices_eod.csv \
              --signals stock_triggers/data/signals_all_patterns.csv \
              --out stock_triggers/data/candle_weights.json
            python stock_triggers/scripts/generate_stock_scores.py
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git add -f -- stock_triggers/data/prices_eod.csv stock_triggers/data/signals_pattern_a.csv stock_triggers/data/sell_signals_pattern_a.csv stock_triggers/data/signals_all_patterns.csv stock_triggers/data/pattern_weights.json stock_triggers/data/signal_penalty_weights.json stock_triggers/data/signal_stop_risk_model.json stock_triggers/data/candle_weights.json stock_triggers/data/stock_scores.csv
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: daily trigger data update [skip ci]"
            if ! git push origin HEAD:master; then
              echo "Push failed because origin/master moved. Regenerating from latest master and retrying once..."
              git fetch origin master
              git reset --hard origin/master
              regenerate_outputs
              git add -f -- stock_triggers/data/prices_eod.csv stock_triggers/data/signals_pattern_a.csv stock_triggers/data/sell_signals_pattern_a.csv stock_triggers/data/signals_all_patterns.csv stock_triggers/data/pattern_weights.json stock_triggers/data/signal_penalty_weights.json stock_triggers/data/signal_stop_risk_model.json stock_triggers/data/candle_weights.json stock_triggers/data/stock_scores.csv
              if git diff --cached --quiet; then
                echo "No data changes to commit after retry."
              else
                git commit -m "chore: daily trigger data update [skip ci]"
                git push origin HEAD:master
              fi
            fi
          fi

      - name: Send Telegram update (optional)
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "Telegram secrets not set. Skipping Telegram notification."
            exit 0
          fi
          python stock_triggers/scripts/daily_triggers_telegram.py --send-only
