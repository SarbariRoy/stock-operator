name: Signal Refresh Cadence

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Run profile"
        required: true
        default: incremental
        type: choice
        options:
          - incremental
          - full_backfill
          - deep_refresh
      days:
        description: "Price lookback days used when refresh-prices=true"
        required: true
        default: "1200"
        type: string
  schedule:
    # 11:00 UTC ~= 16:30 IST
    # Daily incremental cadence (Mon-Thu)
    - cron: "0 11 * * 1-4"
    # Weekly full backfill cadence (Sun)
    - cron: "0 11 * * 0"
    # Monthly deep refresh cadence (1st day of month, 16:45 IST)
    - cron: "15 11 1 * *"

concurrency:
  group: full-refresh-master
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-daily-triggers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve run profile
        id: profile
        run: |
          set -euo pipefail

          PROFILE="${{ github.event_name == 'workflow_dispatch' && inputs.profile || '' }}"
          DAYS="${{ github.event_name == 'workflow_dispatch' && inputs.days || '' }}"

          if [ -z "${PROFILE}" ]; then
            case "${{ github.event.schedule }}" in
              "15 11 1 * *") PROFILE="deep_refresh" ;;
              "0 11 * * 0") PROFILE="full_backfill" ;;
              *) PROFILE="incremental" ;;
            esac
          fi

          if [ -z "${DAYS}" ]; then
            if [ "${PROFILE}" = "deep_refresh" ]; then
              DAYS="5000"
            else
              DAYS="1200"
            fi
          fi

          case "${PROFILE}" in
            incremental)
              MODE="incremental"
              REFRESH_PRICES="true"
              RECOMPUTE_PATTERN_WEIGHTS="false"
              RECOMPUTE_CANDLE_WEIGHTS="false"
              BACKFILL_HISTORY="false"
              ;;
            full_backfill)
              MODE="daily"
              REFRESH_PRICES="true"
              RECOMPUTE_PATTERN_WEIGHTS="true"
              RECOMPUTE_CANDLE_WEIGHTS="true"
              BACKFILL_HISTORY="true"
              ;;
            deep_refresh)
              MODE="daily"
              REFRESH_PRICES="true"
              RECOMPUTE_PATTERN_WEIGHTS="true"
              RECOMPUTE_CANDLE_WEIGHTS="true"
              BACKFILL_HISTORY="true"
              ;;
            *)
              echo "Unsupported profile: ${PROFILE}" >&2
              exit 1
              ;;
          esac

          echo "profile=${PROFILE}" >> "$GITHUB_OUTPUT"
          echo "mode=${MODE}" >> "$GITHUB_OUTPUT"
          echo "refresh_prices=${REFRESH_PRICES}" >> "$GITHUB_OUTPUT"
          echo "recompute_pattern_weights=${RECOMPUTE_PATTERN_WEIGHTS}" >> "$GITHUB_OUTPUT"
          echo "recompute_candle_weights=${RECOMPUTE_CANDLE_WEIGHTS}" >> "$GITHUB_OUTPUT"
          echo "backfill_history=${BACKFILL_HISTORY}" >> "$GITHUB_OUTPUT"
          echo "days=${DAYS}" >> "$GITHUB_OUTPUT"

          echo "Resolved profile=${PROFILE}, mode=${MODE}, days=${DAYS}"

      - name: Run refresh pipeline
        run: |
          python stock_triggers/scripts/run_signal_refresh_pipeline.py \
            --mode "${{ steps.profile.outputs.mode }}" \
            --refresh-prices "${{ steps.profile.outputs.refresh_prices }}" \
            --recompute-pattern-weights "${{ steps.profile.outputs.recompute_pattern_weights }}" \
            --recompute-candle-weights "${{ steps.profile.outputs.recompute_candle_weights }}" \
            --backfill-history "${{ steps.profile.outputs.backfill_history }}" \
            --days "${{ steps.profile.outputs.days }}"

      - name: Verify coverage guardrails
        run: |
          python - <<'PY'
          from __future__ import annotations

          import io
          import subprocess
          import sys
          from pathlib import Path

          import pandas as pd

          FILES = [
            "stock_triggers/data/lt_signals_pattern_a.csv",
            "stock_triggers/data/st_signals_all_patterns.csv",
            "stock_triggers/data/lt_stop_risk_walk_forward_oos_complete.csv",
          ]

          def load_current(path_str: str) -> pd.DataFrame | None:
            path = Path(path_str)
            if not path.exists():
              print(f"ERROR: required file missing after pipeline run: {path_str}")
              return None
            return pd.read_csv(path)

          def load_head(path_str: str) -> pd.DataFrame | None:
            try:
              blob = subprocess.check_output(["git", "show", f"HEAD:{path_str}"], text=True)
            except subprocess.CalledProcessError:
              return None
            return pd.read_csv(io.StringIO(blob))

          def normalize(df: pd.DataFrame, path_str: str) -> pd.DataFrame:
            out = df.copy()
            if path_str.endswith("lt_stop_risk_walk_forward_oos_complete.csv") and "candidate_name" in out.columns:
              out = out[out["candidate_name"].astype(str) == "scores_only"].copy()
            out["signal_date"] = pd.to_datetime(out.get("signal_date"), errors="coerce")
            out = out.dropna(subset=["signal_date"]).copy()
            return out

          failures: list[str] = []
          for path_str in FILES:
            current_raw = load_current(path_str)
            if current_raw is None:
              failures.append(f"missing current file: {path_str}")
              continue
            current = normalize(current_raw, path_str)
            if current.empty:
              failures.append(f"empty signal_date coverage after run: {path_str}")
              continue

            current_min = current["signal_date"].min()
            current_max = current["signal_date"].max()
            print(f"CURRENT {path_str}: rows={len(current)} min={current_min.date()} max={current_max.date()}")

            head_raw = load_head(path_str)
            if head_raw is None:
              print(f"BASELINE {path_str}: not present in HEAD, skipping shrinkage comparison")
              continue
            head = normalize(head_raw, path_str)
            if head.empty:
              print(f"BASELINE {path_str}: empty in HEAD, skipping shrinkage comparison")
              continue

            head_min = head["signal_date"].min()
            head_max = head["signal_date"].max()
            print(f"HEAD    {path_str}: rows={len(head)} min={head_min.date()} max={head_max.date()}")

            if current_min > head_min:
              failures.append(
                f"coverage shrank at start for {path_str}: current min {current_min.date()} > head min {head_min.date()}"
              )
            if current_max < head_max:
              failures.append(
                f"coverage shrank at end for {path_str}: current max {current_max.date()} < head max {head_max.date()}"
              )

          if failures:
            print("\nCOVERAGE_GUARDRAIL_FAILURES:")
            for failure in failures:
              print(f"- {failure}")
            sys.exit(1)

          print("\nCoverage guardrails passed.")
          PY

      - name: Publish pipeline alerts summary
        if: always()
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          alerts_path = Path("stock_triggers/data/pipeline_alerts.json")

          lines = ["## Pipeline Alerts", ""]
          if not alerts_path.exists():
            lines.append("- No alerts file found.")
            with summary_path.open("a", encoding="utf-8") as fh:
              fh.write("\n".join(lines) + "\n")
            raise SystemExit(0)

          try:
            payload = json.loads(alerts_path.read_text(encoding="utf-8"))
          except Exception as exc:
            lines.append(f"- Failed to parse alerts payload: {exc}")
            with summary_path.open("a", encoding="utf-8") as fh:
              fh.write("\n".join(lines) + "\n")
            raise SystemExit(0)

          runtime_seconds = int(payload.get("runtime_seconds", 0) or 0)
          runtime_threshold = int(payload.get("runtime_threshold_seconds", 3600) or 3600)
          runtime_breach = bool(payload.get("runtime_breach", False))
          policy_changed = bool(payload.get("default_policy_changed", False))
          policy_changes = payload.get("default_policy_changes") if isinstance(payload.get("default_policy_changes"), list) else []

          lines.append(f"- Runtime: {runtime_seconds}s (threshold {runtime_threshold}s)")
          lines.append(f"- Runtime breach: {'yes' if runtime_breach else 'no'}")
          lines.append(f"- Default policy changed: {'yes' if policy_changed else 'no'}")

          if policy_changed and policy_changes:
            lines.append("")
            lines.append("### Default Policy Diff")
            for change in policy_changes:
              field = str(change.get("field", ""))
              before = change.get("before")
              after = change.get("after")
              lines.append(f"- {field}: {before} -> {after}")

          with summary_path.open("a", encoding="utf-8") as fh:
            fh.write("\n".join(lines) + "\n")
          PY

      - name: Commit updated data files
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git add -f -- stock_triggers/data/st_lt_prices_eod.csv stock_triggers/data/lt_signals_pattern_a.csv stock_triggers/data/lt_sell_signals.csv stock_triggers/data/st_signals_all_patterns.csv stock_triggers/data/st_lt_pattern_weights.json stock_triggers/data/st_lt_signal_penalty_weights.json stock_triggers/data/st_lt_signal_stop_risk_model.json stock_triggers/data/st_lt_candle_weights.json stock_triggers/data/lt_stop_risk_walk_forward_oos_complete.csv stock_triggers/data/universe_signal_scores.csv stock_triggers/data/scoring_defaults_snapshot.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: daily trigger data update [skip ci]"
            if ! git push origin HEAD:master; then
              echo "Push failed because origin/master moved. Regenerating from latest master and retrying once..."
              git fetch origin master
              git reset --hard origin/master
              python stock_triggers/scripts/run_signal_refresh_pipeline.py \
                --mode "${{ steps.profile.outputs.mode }}" \
                --refresh-prices "${{ steps.profile.outputs.refresh_prices }}" \
                --recompute-pattern-weights "${{ steps.profile.outputs.recompute_pattern_weights }}" \
                --recompute-candle-weights "${{ steps.profile.outputs.recompute_candle_weights }}" \
                --backfill-history "${{ steps.profile.outputs.backfill_history }}" \
                --days "${{ steps.profile.outputs.days }}"
              git add -f -- stock_triggers/data/st_lt_prices_eod.csv stock_triggers/data/lt_signals_pattern_a.csv stock_triggers/data/lt_sell_signals.csv stock_triggers/data/st_signals_all_patterns.csv stock_triggers/data/st_lt_pattern_weights.json stock_triggers/data/st_lt_signal_penalty_weights.json stock_triggers/data/st_lt_signal_stop_risk_model.json stock_triggers/data/st_lt_candle_weights.json stock_triggers/data/lt_stop_risk_walk_forward_oos_complete.csv stock_triggers/data/universe_signal_scores.csv stock_triggers/data/scoring_defaults_snapshot.json
              if git diff --cached --quiet; then
                echo "No data changes to commit after retry."
              else
                git commit -m "chore: daily trigger data update [skip ci]"
                git push origin HEAD:master
              fi
            fi
          fi

      - name: Send Telegram update (optional)
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "Telegram secrets not set. Skipping Telegram notification."
            exit 0
          fi
          python stock_triggers/scripts/daily_triggers_telegram.py --send-only --alerts-json stock_triggers/data/pipeline_alerts.json
