name: Signal Refresh Cadence

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Run profile"
        required: true
        default: incremental
        type: choice
        options:
          - incremental
          - full_backfill
          - deep_refresh
      days:
        description: "Price lookback days used when refresh-prices=true"
        required: true
        default: "1200"
        type: string
  schedule:
    # 13:30 UTC ~= 19:00 IST
    # Daily incremental cadence (Mon-Thu)
    - cron: "30 13 * * 1-4"
    # Weekly full backfill cadence (Sun)
    - cron: "30 13 * * 0"
    # Monthly deep refresh cadence (1st day of month)
    - cron: "45 13 1 * *"

concurrency:
  group: full-refresh-master
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-daily-triggers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve run profile
        id: profile
        run: |
          set -euo pipefail

          PROFILE="${{ github.event_name == 'workflow_dispatch' && inputs.profile || '' }}"
          DAYS="${{ github.event_name == 'workflow_dispatch' && inputs.days || '' }}"

          if [ -z "${PROFILE}" ]; then
            case "${{ github.event.schedule }}" in
              "45 13 1 * *") PROFILE="deep_refresh" ;;
              "30 13 * * 0") PROFILE="full_backfill" ;;
              *) PROFILE="incremental" ;;
            esac
          fi

          if [ -z "${DAYS}" ]; then
            if [ "${PROFILE}" = "deep_refresh" ]; then
              DAYS="5000"
            else
              DAYS="1200"
            fi
          fi

          case "${PROFILE}" in
            incremental)
              MODE="incremental"
              REFRESH_PRICES="true"
              RECOMPUTE_PATTERN_WEIGHTS="false"
              BACKFILL_HISTORY="false"
              INCLUDE_STOCK_SCORES="false"
              ;;
            full_backfill)
              MODE="daily"
              REFRESH_PRICES="true"
              RECOMPUTE_PATTERN_WEIGHTS="true"
              BACKFILL_HISTORY="true"
              INCLUDE_STOCK_SCORES="true"
              ;;
            deep_refresh)
              MODE="daily"
              REFRESH_PRICES="true"
              RECOMPUTE_PATTERN_WEIGHTS="true"
              BACKFILL_HISTORY="true"
              INCLUDE_STOCK_SCORES="true"
              ;;
            *)
              echo "Unsupported profile: ${PROFILE}" >&2
              exit 1
              ;;
          esac

          echo "profile=${PROFILE}" >> "$GITHUB_OUTPUT"
          echo "mode=${MODE}" >> "$GITHUB_OUTPUT"
          echo "refresh_prices=${REFRESH_PRICES}" >> "$GITHUB_OUTPUT"
          echo "recompute_pattern_weights=${RECOMPUTE_PATTERN_WEIGHTS}" >> "$GITHUB_OUTPUT"
          echo "backfill_history=${BACKFILL_HISTORY}" >> "$GITHUB_OUTPUT"
          echo "include_stock_scores=${INCLUDE_STOCK_SCORES}" >> "$GITHUB_OUTPUT"
          echo "days=${DAYS}" >> "$GITHUB_OUTPUT"

          echo "Resolved profile=${PROFILE}, mode=${MODE}, days=${DAYS}"

      - name: Run refresh pipeline
        run: |
          python stock_triggers/scripts/run_signal_refresh_pipeline.py \
            --mode "${{ steps.profile.outputs.mode }}" \
            --refresh-prices "${{ steps.profile.outputs.refresh_prices }}" \
            --recompute-pattern-weights "${{ steps.profile.outputs.recompute_pattern_weights }}" \
            --backfill-history "${{ steps.profile.outputs.backfill_history }}" \
            --include-stock-scores "${{ steps.profile.outputs.include_stock_scores }}" \
            --days "${{ steps.profile.outputs.days }}"

      - name: Commit updated data files
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git add -f -- stock_triggers/data/st_lt_prices_eod.csv stock_triggers/data/lt_signals_pattern_a.csv stock_triggers/data/lt_sell_signals.csv stock_triggers/data/st_signals_all_patterns.csv stock_triggers/data/st_lt_pattern_weights.json stock_triggers/data/st_lt_signal_penalty_weights.json stock_triggers/data/st_lt_signal_stop_risk_model.json stock_triggers/data/st_lt_candle_weights.json stock_triggers/data/stock_scores.csv
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: daily trigger data update [skip ci]"
            if ! git push origin HEAD:master; then
              echo "Push failed because origin/master moved. Regenerating from latest master and retrying once..."
              git fetch origin master
              git reset --hard origin/master
              python stock_triggers/scripts/run_signal_refresh_pipeline.py \
                --mode "${{ steps.profile.outputs.mode }}" \
                --refresh-prices "${{ steps.profile.outputs.refresh_prices }}" \
                --recompute-pattern-weights "${{ steps.profile.outputs.recompute_pattern_weights }}" \
                --backfill-history "${{ steps.profile.outputs.backfill_history }}" \
                --include-stock-scores "${{ steps.profile.outputs.include_stock_scores }}" \
                --days "${{ steps.profile.outputs.days }}"
              git add -f -- stock_triggers/data/st_lt_prices_eod.csv stock_triggers/data/lt_signals_pattern_a.csv stock_triggers/data/lt_sell_signals.csv stock_triggers/data/st_signals_all_patterns.csv stock_triggers/data/st_lt_pattern_weights.json stock_triggers/data/st_lt_signal_penalty_weights.json stock_triggers/data/st_lt_signal_stop_risk_model.json stock_triggers/data/st_lt_candle_weights.json stock_triggers/data/stock_scores.csv
              if git diff --cached --quiet; then
                echo "No data changes to commit after retry."
              else
                git commit -m "chore: daily trigger data update [skip ci]"
                git push origin HEAD:master
              fi
            fi
          fi

      - name: Send Telegram update (optional)
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "Telegram secrets not set. Skipping Telegram notification."
            exit 0
          fi
          python stock_triggers/scripts/daily_triggers_telegram.py --send-only
