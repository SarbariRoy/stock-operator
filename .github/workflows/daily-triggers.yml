name: Full Refresh Pipeline

on:
  workflow_dispatch:
    inputs:
      backfill_history:
        description: "Rebuild full historical signal files instead of incrementally updating existing history"
        required: true
        default: false
        type: boolean
  schedule:
    # 13:30 UTC ~= 19:00 IST, Sun-Thu so the next trading day is prepared in advance.
    - cron: "30 13 * * 0-4"

concurrency:
  group: full-refresh-master
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-daily-triggers:
    runs-on: ubuntu-latest
    env:
      BACKFILL_HISTORY: ${{ inputs.backfill_history }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh prices
        run: |
          python stock_triggers/scripts/run_signal_refresh_pipeline.py \
            --mode daily \
            --refresh-prices true \
            --recompute-pattern-weights true \
            --backfill-history "${BACKFILL_HISTORY}" \
            --include-stock-scores true

      - name: Commit updated data files
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git add -f -- stock_triggers/data/prices_eod.csv stock_triggers/data/signals_pattern_a.csv stock_triggers/data/sell_signals_pattern_a.csv stock_triggers/data/signals_all_patterns.csv stock_triggers/data/pattern_weights.json stock_triggers/data/signal_penalty_weights.json stock_triggers/data/signal_stop_risk_model.json stock_triggers/data/candle_weights.json stock_triggers/data/stock_scores.csv
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: daily trigger data update [skip ci]"
            if ! git push origin HEAD:master; then
              echo "Push failed because origin/master moved. Regenerating from latest master and retrying once..."
              git fetch origin master
              git reset --hard origin/master
              python stock_triggers/scripts/run_signal_refresh_pipeline.py \
                --mode daily \
                --refresh-prices true \
                --recompute-pattern-weights true \
                --backfill-history "${BACKFILL_HISTORY}" \
                --include-stock-scores true
              git add -f -- stock_triggers/data/prices_eod.csv stock_triggers/data/signals_pattern_a.csv stock_triggers/data/sell_signals_pattern_a.csv stock_triggers/data/signals_all_patterns.csv stock_triggers/data/pattern_weights.json stock_triggers/data/signal_penalty_weights.json stock_triggers/data/signal_stop_risk_model.json stock_triggers/data/candle_weights.json stock_triggers/data/stock_scores.csv
              if git diff --cached --quiet; then
                echo "No data changes to commit after retry."
              else
                git commit -m "chore: daily trigger data update [skip ci]"
                git push origin HEAD:master
              fi
            fi
          fi

      - name: Send Telegram update (optional)
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "Telegram secrets not set. Skipping Telegram notification."
            exit 0
          fi
          python stock_triggers/scripts/daily_triggers_telegram.py --send-only
